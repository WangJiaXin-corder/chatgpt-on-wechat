version: '2.0'
services:
  chatgpt-on-wechat:
    image: registry.cn-guangzhou.aliyuncs.com/kangarooking/chatgpt-on-wechat:250131
    container_name: chatgpt-on-wechat
    security_opt:
      - seccomp:unconfined
    environment:
      OPEN_AI_API_KEY: 'sk-39q5QXb8Hz3NuvSq73D910F1Ca1f4aB3B0B93e6bFa51Ba4c'
      OPEN_AI_API_BASE: 'https://api.deepseek.com/v1'
      MODEL: 'deepseek-chat'
      SINGLE_CHAT_PREFIX: '[""]'
      SINGLE_CHAT_REPLY_PREFIX: '" "'
      GROUP_CHAT_PREFIX: '["@凰烬鸢"]'
      GROUP_NAME_WHITE_LIST: '["测试1群", "测试2群"]'
      IMAGE_CREATE_PREFIX: '["画", "看", "找"]'
      CONVERSATION_MAX_TOKENS: 3000
      SPEECH_RECOGNITION: 'False'
      CHARACTER_DESC: '你是我的人工智能助手'
      EXPIRES_IN_SECONDS: 3600
      USE_GLOBAL_PLUGIN_CONFIG: 'True'
      HOT_RELOAD: 'True'
